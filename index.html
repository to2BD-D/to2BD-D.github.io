<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хумпэйдж</title>
    <style>
/* начало звездеца */
        :root {
            --boloto-fon: #008080;     --tochki-v-glaza: #006666;     --seraya-parasha: #c0c0c0;     --shapka-nachalo: #000080;     --shapka-konec: #1084d0;     --belaya-dyra: #ffffff;        --yarkiy-vyrviglaz: #000080;        --razmer-ebaniny: 420px;      --skorost-epilepsii: 1.2s;
        }
/* ну а че бы и нет)) */ /* Вам нравица такой красиви код?*/
body {            background-color: var(--boloto-fon);
            background-image: radial-gradient(var(--tochki-v-glaza) 1px, transparent 1px);      background-size: 4px 4px;
            font-family: "Tahoma", "MS Sans Serif", Arial, sans-serif;         margin: 0;           padding: 0;
            display: flex;          justify-content: center;         align-items: center;
            min-height: 100vh;         color: #000000;
        }
        .glavnaya-hyevina {
            width: 90%;     max-width: var(--razmer-ebaniny);
            background-color: var(--seraya-parasha);       border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;    border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;         box-shadow: 4px 4px 0px #000000;          padding: 3px;
        }
        /* Вам нравица такой красиви код?*/
.taitle-poloska {
            background: linear-gradient(90deg, var(--shapka-nachalo), var(--shapka-konec));
            color: #ffffff;
            font-weight: bold;
            font-size: 13px;           padding: 4px 6px;
            display: flex;
          justify-content: space-between;         align-items: center;
            letter-spacing: 0.5px;
        }
        .knopki-dlya-lohov span {
            display: inline-block;
                   background: var(--seraya-parasha);
           color: #000000;
            border-top: 1px solid #ffffff;
            border-left: 1px solid #ffffff;
         border-right: 1px solid #404040;
           border-bottom: 1px solid #404040;
            width: 14px;       height: 14px;
        text-align: center;
            line-height: 13px;         font-size: 11px;
            font-weight: bold;     }
 .kisha-okna {/* Вам нравица такой красиви код?*/
        padding: 25px 20px;
    text-align: center;
      }
      .pustoy-kvadrat {         background-color: var(--belaya-dyra);
         border-top: 2px solid #808080;
         border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;         border-bottom: 2px solid #ffffff;
            padding: 45px 20px;
           margin-bottom: 15px;
        }
        .migayushaya-fignya {
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;      font-size: 16px;
            color: var(--yarkiy-vyrviglaz);         animation: epilepsiya var(--skorost-epilepsii) step-start infinite;
        }
        @keyframes epilepsiya {
            50% { opacity: 0; }
        }
        .dno-poloska {
            border-top: 1px solid #808080;          border-left: 1px solid #808080;
            border-right: 1px solid #ffffff;          border-bottom: 1px solid #ffffff;
          padding: 3px 6px;          font-size: 11px;
            text-align: left;         color: #333333;
    /* Вам нравица такой красиви код?*/    }
    </style>
    
</head>

<body>
    <div class="glavnaya-hyevina">

            <span>_</span>
            <span>□</span>
                <span>×</span>
            </div>
        </div>
        
        <div class="kisha-okna">
            <div class="pustoy-kvadrat">
                <div class="migayushaya-fignya">[ СКОРО ЗДЕСЬ ЧТО-ТО БУДЕТ... ]</div>
               <p style="font-size: 12px; color: #555; margin-top: 12px;">
        Страница в разработке.<br>Заходите позже!
                </p>
            </div>
        <div class="dno-poloska">

</html>
